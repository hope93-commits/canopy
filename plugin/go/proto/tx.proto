syntax = "proto3";
package types;
option go_package = "github.com/canopy-network/go-plugin/contract";

import "google/protobuf/any.proto";

message Transaction {
  string message_type = 1; // @gotags: json:"messageType"
  google.protobuf.Any msg = 2;
  Signature signature = 3;
  uint64 created_height = 4; // @gotags: json:"createdHeight"
  uint64 time = 5;
  uint64 fee = 6;
  string memo = 7;
  uint64 network_id = 8; // @gotags: json:"networkID"
  uint64 chain_id = 9; // @gotags: json:"chainID"
}

message MessageSend {
  bytes from_address = 1; // @gotags: json:"fromAddress"
  bytes to_address = 2; // @gotags: json:"toAddress"
  uint64 amount = 3;
}

// ── Lattice Transaction Types ──────────────────────────────────────────────

// RegisterProtocol: a Nested Chain registers as a Lattice reputation source
message MessageRegisterProtocol {
  bytes admin_address = 1;  // @gotags: json:"adminAddress"
  string protocol_name = 2; // @gotags: json:"protocolName"
  string protocol_url  = 3; // @gotags: json:"protocolUrl"
}

// EmitReputationEvent: a registered protocol emits a reputation event for an address
message MessageEmitReputationEvent {
  bytes protocol_address = 1; // @gotags: json:"protocolAddress"
  bytes subject_address  = 2; // @gotags: json:"subjectAddress"
  string event_type      = 3; // @gotags: json:"eventType"
  uint64 base_points     = 4; // @gotags: json:"basePoints"
}

// FollowAddress: directed follow, no stake required
message MessageFollowAddress {
  bytes follower_address = 1; // @gotags: json:"followerAddress"
  bytes target_address   = 2; // @gotags: json:"targetAddress"
}

// UnfollowAddress: remove a directed follow
message MessageUnfollowAddress {
  bytes follower_address = 1; // @gotags: json:"followerAddress"
  bytes target_address   = 2; // @gotags: json:"targetAddress"
}

// EndorseAddress: staked endorsement, weight tied to endorser reputation score
message MessageEndorseAddress {
  bytes endorser_address = 1; // @gotags: json:"endorserAddress"
  bytes subject_address  = 2; // @gotags: json:"subjectAddress"
  uint64 stake_amount    = 3; // @gotags: json:"stakeAmount"
}

// RevokeEndorsement: unstake and remove an endorsement
message MessageRevokeEndorsement {
  bytes endorser_address = 1; // @gotags: json:"endorserAddress"
  bytes subject_address  = 2; // @gotags: json:"subjectAddress"
}

// ── Lattice State Objects ──────────────────────────────────────────────────

// ReputationEvent: a single on-chain reputation signal
message ReputationEvent {
  bytes  protocol_address = 1; // @gotags: json:"protocolAddress"
  string event_type       = 2; // @gotags: json:"eventType"
  uint64 base_points      = 3; // @gotags: json:"basePoints"
  uint64 block_height     = 4; // @gotags: json:"blockHeight"
}

// Endorsement: a staked endorsement from one address to another
message Endorsement {
  bytes  endorser_address        = 1; // @gotags: json:"endorserAddress"
  uint64 stake_amount            = 2; // @gotags: json:"stakeAmount"
  uint64 endorser_score_snapshot = 3; // @gotags: json:"endorserScoreSnapshot"
  uint64 block_height            = 4; // @gotags: json:"blockHeight"
}

// LatticeProfile: the full on-chain identity for an address
message LatticeProfile {
  bytes   address              = 1;
  uint64  raw_score            = 2; // @gotags: json:"rawScore"
  repeated ReputationEvent events     = 3;
  repeated bytes           followers  = 4;
  repeated bytes           following  = 5;
  repeated Endorsement     endorsements_received = 6; // @gotags: json:"endorsementsReceived"
  repeated bytes           endorsing  = 7;
  uint64  endorsement_stake   = 8; // @gotags: json:"endorsementStake"
}

// Protocol: a registered Lattice protocol source
message Protocol {
  bytes  admin_address  = 1; // @gotags: json:"adminAddress"
  string protocol_name  = 2; // @gotags: json:"protocolName"
  string protocol_url   = 3; // @gotags: json:"protocolUrl"
  uint64 block_height   = 4; // @gotags: json:"blockHeight"
}

// ── Fee & Signature ────────────────────────────────────────────────────────

message FeeParams {
  uint64 send_fee = 1; // @gotags: json:"sendFee"
}

message Signature {
  bytes public_key = 1; // @gotags: json:"publicKey"
  bytes signature  = 2;
}
